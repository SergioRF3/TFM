name: Deploy to Azure

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login en ACR
        uses: docker/login-action@v3
        with:
          registry: tfmregistry2026-h6a8c2ftc9dhcree.azurecr.io
          username: tfmregistry2026
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build y Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: tfmregistry2026-h6a8c2ftc9dhcree.azurecr.io/backend-fastapi:${{ github.sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name tfmapp2026 \
              --resource-group TFM \
              --image tfmregistry2026-h6a8c2ftc9dhcree.azurecr.io/backend-fastapi:${{ github.sha }}
